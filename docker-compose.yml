services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vehicle_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vehicle_agent_pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vehicle_agent_pg:
