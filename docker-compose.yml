services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vehicle_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vehicle_agent_pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/vehicle_agent
      FRONTEND_ORIGIN: http://localhost:5173
      AUTO_CREATE_SCHEMA: "false"
      AGENT_TOOL_MODE: mcp
      MCP_SERVER_URL: http://mcp:8001/mcp
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic -c backend/alembic.ini upgrade head && python -m backend.scripts.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/vehicle_agent
      AUTO_CREATE_SCHEMA: "false"
      AGENT_TOOL_MODE: mcp
      MCP_SERVER_URL: http://mcp:8001/mcp
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic -c backend/alembic.ini upgrade head && python -m backend.app.mcp_server --transport streamable-http --host 0.0.0.0 --port 8001"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/vehicle_agent
      AUTO_CREATE_SCHEMA: "false"
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  vehicle_agent_pg:
